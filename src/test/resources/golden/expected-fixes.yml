# Diferencias aprobadas entre el baseline legacy y el golden vigente.
# Cada entrada debe corresponder a un ID del plan (REFACTOR_HEXAGONAL_PLAN.md §2).
- id: C1-empty-cargosclase
  report: cargosclase
  scenario: vacio
  reason: >-
    El PDF sin datos ahora se cierra correctamente y agrega la leyenda
    "Sin datos para el período." (C1). El resto del encabezado y el pie no cambian.
- id: C1-empty-comparacioncodigos
  report: comparacioncodigos
  scenario: vacio
  reason: >-
    Antes el PDF quedaba en 0 bytes (return sin document.close()). Ahora se cierra y
    agrega "Sin datos para el período." (C1). No existia baseline de texto para este caso.
- id: C1-empty-totalescodigo
  report: totalescodigo
  scenario: vacio
  reason: >-
    Antes respondia 200 con 0 bytes (return sin document.close()). Ahora genera un PDF
    valido con "Sin datos para el período." (C1).
- id: C4-order-cargosclaseperiodo
  report: cargosclaseperiodo
  scenario: normal
  reason: >-
    Las sedes dejan de salir en el orden arbitrario del HashMap y se emiten
    alfabeticamente por nombre (C4). El contenido de cada sede, las filas y el
    encabezado no cambian.
